<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Event</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f7f5f2;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 35px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 15px 0;
            border-radius: 14px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .upload {
            background: #222;
            color: white;
        }

        .album {
            background: white;
            color: #222;
            border: 2px solid #222;
        }

        .note {
            margin-top: 30px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📸 Our Event</h1>

        <p>
            Share your moments with us!
        </p>

        <a href="upload.html" class="button upload">
            📷 Upload Media
        </a>

        <a href="album.html" class="button album">
            🖼️ View Album
        </a>

        <div class="note">
            No account required
        </div>

    </div>

</body>
</html>
